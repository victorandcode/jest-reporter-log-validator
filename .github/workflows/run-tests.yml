name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        jest: ["26.6.3", "27.5.1", "28.1.3", "29.7.0", "30.5.2"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use Jest ${{ matrix.jest }}
        run: pnpm add --save-dev --ignore-scripts jest@${{ matrix.jest }}

      - name: Lint and format check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Check published package contents
        run: pnpm pack --dry-run
